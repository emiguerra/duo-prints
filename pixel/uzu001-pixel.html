const PAPEL = '#E9ECF4';
const c = document.getElementById('c'), ctx = c.getContext('2d');
const $ = id => document.getElementById(id);
const img = new Image();

// azar reproducible: con la misma semilla el dibujo no cambia
function azar(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function dibujar() {
  const celda = +$('celda').value, alto = +$('alto').value / 100, ruido = +$('ruido').value / 100;
  const nSueltos = +$('sueltos').value, anillos = $('anillos').checked, color = $('color').value;
  const rnd = azar(+$('semilla').value);
  ['celda', 'alto', 'ruido', 'sueltos', 'semilla'].forEach(k => $(k + 'V').textContent = $(k).value);

  const W = c.width, H = c.height;
  ctx.fillStyle = PAPEL; ctx.fillRect(0, 0, W, H);

  // la lámpara reducida a una grilla: un pixel de la imagen = una celda
  const hL = H * alto, wL = hL * img.width / img.height;
  const filas = Math.round(hL / celda), cols = Math.max(1, Math.round(wL / celda));
  const off = document.createElement('canvas'); off.width = cols; off.height = filas;
  const o = off.getContext('2d'); o.imageSmoothingQuality = 'high';
  o.drawImage(img, 0, 0, cols, filas);
  const px = o.getImageData(0, 0, cols, filas).data;

  const x0 = Math.round((W - cols * celda) / 2 / celda) * celda;
  const y0 = Math.round((H - filas * celda) / 2 / celda) * celda;
  ctx.fillStyle = color;

  const borde = [];
  for (let y = 0; y < filas; y++) for (let x = 0; x < cols; x++) {
    const i = (y * cols + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2], a = px[i + 3] / 255;
    // el borde se decide con un umbral que tiembla, para que quede escalonado como la referencia
    const umbral = 0.5 + (rnd() - 0.5) * ruido;
    if (a < umbral) { if (a > 0.05) borde.push([x, y]); continue; }

    if (anillos && r - b > 45 && r > 70) continue;
    ctx.fillRect(x0 + x * celda, y0 + y * celda, celda, celda);
    if (x === 0 || x === cols - 1) borde.push([x, y]);
  }

  // pixeles sueltos alrededor de la silueta
  for (let k = 0; k < nSueltos && borde.length; k++) {
    const [bx, by] = borde[Math.floor(rnd() * borde.length)];
    const d = 1 + Math.floor(Math.pow(rnd(), 2) * 12);          // la mayoría cerca, algunos lejos
    const ang = rnd() * Math.PI * 2;
    const sx = bx + Math.round(Math.cos(ang) * d), sy = by + Math.round(Math.sin(ang) * d * 0.6);
    const t = rnd() < 0.8 ? 0.5 : 1;                              // la mayoría a media celda
    ctx.fillRect(x0 + sx * celda, y0 + sy * celda, celda * t, celda * t);
  }
}

img.onload = dibujar;
img.src = IMG;
document.querySelectorAll('input').forEach(i => i.addEventListener('input', dibujar));

};

const W = 3508, H = 4961;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const src = new Image();
let base; // {w,h,lum,alpha} a resolución de la imagen embebida

src.onload = () => {
  const t = document.createElement('canvas'); t.width = src.width; t.height = src.height;
  const tc = t.getContext('2d'); tc.drawImage(src, 0, 0);
  const d = tc.getImageData(0, 0, t.width, t.height).data;
  const n = t.width * t.height, lum = new Float32Array(n), alpha = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    lum[i] = (0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2]) / 255;
    alpha[i] = d[i*4+3] / 255;
  }
  base = { w: t.width, h: t.height, lum, alpha };
  draw();
};
src.src = IMG;

// desenfoque de caja separable (para el realce de pliegues)
function blur(a, w, h, r) {
  const tmp = new Float32Array(a.length), out = new Float32Array(a.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let k = -r; k <= r; k++) { const X = x + k; if (X >= 0 && X < w) { s += a[y*w+X]; c++; } }
    tmp[y*w+x] = s / c;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let k = -r; k <= r; k++) { const Y = y + k; if (Y >= 0 && Y < h) { s += tmp[Y*w+x]; c++; } }
    out[y*w+x] = s / c;
  }
  return out;
}

// remuestreo por área a cols×rows
function resample(a, w, h, cols, rows) {
  const out = new Float32Array(cols * rows);
  for (let y = 0; y < rows; y++) {
    const y0 = Math.floor(y * h / rows), y1 = Math.max(y0 + 1, Math.floor((y + 1) * h / rows));
    for (let x = 0; x < cols; x++) {
      const x0 = Math.floor(x * w / cols), x1 = Math.max(x0 + 1, Math.floor((x + 1) * w / cols));
      let s = 0, c = 0;
      for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) { s += a[j*w+i]; c++; }
      out[y*cols+x] = s / c;
    }
  }
  return out;
}

function bayer(n) {
  let m = [[0, 2], [3, 1]];
  while (m.length < n) {
    const k = m.length, nm = [];
    for (let y = 0; y < 2*k; y++) { nm.push([]); for (let x = 0; x < 2*k; x++) {
      const v = m[y % k][x % k], q = [[0, 2], [3, 1]][Math.floor(y / k)][Math.floor(x / k)];
      nm[y].push(4 * v + q);
    } }
    m = nm;
  }
  return m.map(r => r.map(v => (v + 0.5) / (n * n)));
}

function difusion(g, mask, cols, rows, kernel, div) {
  const a = Float32Array.from(g), ink = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x; if (!mask[i]) continue;
    const o = a[i], nv = o >= 0.5 ? 1 : 0; ink[i] = nv ? 0 : 1;
    const e = (o - nv) / div;
    for (const [dx, dy, wgt] of kernel) {
      const X = x + dx, Y = y + dy;
      if (X >= 0 && X < cols && Y < rows && mask[Y*cols+X]) a[Y*cols+X] += e * wgt;
    }
  }
  return ink;
}
const ATK = [[1,0,1],[2,0,1],[-1,1,1],[0,1,1],[1,1,1],[0,2,1]];
const FS  = [[1,0,7],[-1,1,3],[0,1,5],[1,1,1]];

function draw() {
  if (!base) return;
  const cell = +$('celda').value, alto = $('alto').value / 100;
  const dens = $('dens').value / 100, gamma = $('gamma').value / 100, det = $('detalle').value / 100;
  const modo = $('modo').value, inv = $('inv').checked;
  const azul = $('color').value, papel = $('papel').value;
  ['celda','alto','dens','gamma','detalle'].forEach(k => $(k+'V').textContent = $(k).value);

  // realce de pliegues (unsharp) sobre la luminancia
  let lum = base.lum;
  if (det > 0) {
    const bl = blur(lum, base.w, base.h, Math.round(base.w * 0.08) + 1);
    lum = lum.map((v, i) => v + (v - bl[i]) * det);
  }

  const ph = H * alto, pw = base.w * ph / base.h;
  const cols = Math.round(pw / cell), rows = Math.round(ph / cell);
  let g = resample(lum, base.w, base.h, cols, rows);
  const al = resample(base.alpha, base.w, base.h, cols, rows);
  const mask = al.map(v => v > 0.5 ? 1 : 0);

  // estirar el rango tonal de la lámpara (p2–p99.5)
  const vals = []; for (let i = 0; i < g.length; i++) if (mask[i]) vals.push(g[i]);
  vals.sort((a, b) => a - b);
  const p1 = vals[Math.floor(vals.length * 0.02)], p2 = vals[Math.floor(vals.length * 0.995)];
  const hi = 1 - dens;
  g = g.map(v => hi * Math.pow(Math.min(1, Math.max(0, (v - p1) / (p2 - p1))), gamma));
  if (inv) g = g.map(v => 1 - v);

  let ink;
  if (modo === 'atk') ink = difusion(g, mask, cols, rows, ATK, 8);
  else if (modo === 'fs') ink = difusion(g, mask, cols, rows, FS, 16);
  else {
    ink = new Uint8Array(cols * rows);
    const n = modo === 'b4' ? 4 : modo === 'b8' ? 8 : 0, B = n ? bayer(n) : null;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      ink[i] = mask[i] && g[i] < (B ? B[y % n][x % n] : 0.5) ? 1 : 0;
    }
  }

  // pintar, alineado a la grilla de la página
  const x0 = Math.floor((W - cols * cell) / 2 / cell) * cell;
  const y0 = Math.floor((H - rows * cell) / 2 / cell) * cell;
  ctx.fillStyle = inv ? azul : papel; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = inv ? papel : azul;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x;
    if (inv ? (mask[i] && !ink[i]) : ink[i]) ctx.fillRect(x0 + x * cell, y0 + y * cell, cell, cell);
  }
}

let raf;
document.querySelectorAll('.panel input, .panel select').forEach(el =>
  el.addEventListener('input', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }));

$('png').onclick = () => {
  const a = document.createElement('a');
  a.download = `uzu001-bitmap-${$('modo').value}-${$('celda').value}px.png`;
  a.href = cv.toDataURL('image/png'); a.click();
};
$('ver').onclick = () => {
  const z = $('zoom'); z.innerHTML = '';
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
  c2.getContext('2d').drawImage(cv, 0, 0); z.appendChild(c2);
  z.style.display = 'block'; z.scrollTop = (H - innerHeight) / 2; z.scrollLeft = (W - innerWidth) / 2;
};
$('zoom').onclick = () => $('zoom').style.display = 'none';

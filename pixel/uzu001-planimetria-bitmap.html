<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uzu 001 · planimetría bitmap</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9dbe2; font: 12px 'Courier New', monospace; color: #111; display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
  canvas { width: min(620px, 62vw); height: auto; box-shadow: 0 10px 40px rgba(0,0,0,.15); background: #fff; }
  .panel { display: grid; gap: 14px; width: 250px; position: sticky; top: 24px; }
  label { display: grid; gap: 4px; text-transform: uppercase; letter-spacing: .05em; }
  input[type=range], select { width: 100%; font: inherit; }
  .fila { display: flex; gap: 8px; }
  button { font: inherit; text-transform: uppercase; background: #111; color: #fff; border: 0; padding: 10px; cursor: pointer; flex: 1; }
  button.sec { background: transparent; color: #111; outline: 1px solid #111; }
  .panel { max-height: calc(100vh - 48px); overflow-y: auto; padding-right: 6px; }
  .sep { border-top: 1px solid #111; padding-top: 10px; margin-top: 6px; text-transform: uppercase; letter-spacing: .1em; font-weight: bold; }
  input[type=text] { font: inherit; padding: 6px; border: 1px solid #111; background: #fff; }
  .zoom { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); overflow: auto; z-index: 9; cursor: zoom-out; }
  .zoom canvas { width: auto; max-width: none; display: block; margin: 0 auto; box-shadow: none; }
</style>
</head>
<body>

<canvas id="c" width="3508" height="4961"></canvas>

<div class="panel">
  <label>trama del relleno
    <select id="modo">
      <option value="atk" selected>atkinson (orgánica)</option>
      <option value="fs">floyd–steinberg</option>
      <option value="b4">bayer 4×4 (damero)</option>
      <option value="b8">bayer 8×8</option>
    </select>
  </label>
  <label>tamaño del pixel <input id="celda" type="range" min="4" max="48" value="12"><span id="celdaV"></span></label>
  <label>densidad del relleno <input id="dens" type="range" min="0" max="100" value="45"><span id="densV"></span></label>
  <label>degradé de luz <input id="con" type="range" min="0" max="200" value="90"><span id="conV"></span></label>
  <label>luz desde
    <select id="luz">
      <option value="der" selected>derecha</option>
      <option value="izq">izquierda</option>
      <option value="centro">centro (cilindro)</option>
      <option value="plana">plana (sin degradé)</option>
    </select>
  </label>
  <label>líneas
    <select id="lineas">
      <option value="todas" selected>todas sólidas</option>
      <option value="borde">solo silueta</option>
      <option value="ninguna">ninguna (solo trama)</option>
    </select>
  </label>
  <label>sensibilidad de línea <input id="umbral" type="range" min="5" max="99" value="85"><span id="umbralV"></span></label>
  <label>cerrar huecos <input id="cierre" type="range" min="0" max="4" value="1"><span id="cierreV"></span></label>
  <label>números
    <select id="fuente">
      <option value="Absans" selected>absans</option>
      <option value="Courier New">courier (mono)</option>
      <option value="">sin números</option>
    </select>
  </label>
  <label>tamaño números <input id="tnum" type="range" min="30" max="200" value="80"><span id="tnumV"></span></label>
  <label><span><input id="inv" type="checkbox"> invertir (fondo azul)</span></label>
  <label>color <input id="color" type="color" value="#0000ff"></label>
  <label>papel <input id="papel" type="color" value="#ffffff"></label>
  <div class="sep">texto textura</div>
  <label>palabras <input id="txt" type="text" value="DUO WORKS / UZU001 / MODULAR / DESIGN /"></label>
  <label>disposición
    <select id="tmodo">
      <option value="filas" selected>filas continuas</option>
      <option value="disperso">palabras dispersas</option>
      <option value="no">sin texto</option>
    </select>
  </label>
  <label>dónde
    <select id="tzona">
      <option value="toda" selected>toda la hoja (calado sobre el azul)</option>
      <option value="dentro">solo dentro de la lámpara</option>
      <option value="fuera">solo fuera de la lámpara</option>
    </select>
  </label>
  <label>tipografía texto
    <select id="tfuente">
      <option value="PPNeueBit" selected>neue bit (pixel)</option>
      <option value="Absans">absans</option>
      <option value="Courier New">courier (mono)</option>
    </select>
  </label>
  <label>tamaño texto <input id="ttam" type="range" min="30" max="300" value="90"><span id="ttamV"></span></label>
  <label>interlineado % <input id="tint" type="range" min="100" max="300" value="110"><span id="tintV"></span></label>
  <label>opacidad texto <input id="topa" type="range" min="10" max="100" value="35"><span id="topaV"></span></label>
  <label>cantidad (dispersas) <input id="tcant" type="range" min="5" max="200" value="45"><span id="tcantV"></span></label>
  <label>semilla <input id="tsem" type="range" min="1" max="99" value="7"><span id="tsemV"></span></label>
  <div class="sep">salida</div>
  <div class="fila">
    <button id="ver" class="sec">ver 1:1</button>
    <button id="png">png a3</button>
  </div>
</div>

<div class="zoom" id="zoom"></div>

// zona que se rellena (en px de la imagen fuente): deja fuera el título y los números
const ZONA = { x0: 300, x1: 540 };

// dilatar máscara binaria con radio r
function dilatar(m, w, h, r) {
  if (!r) return m;
  const out = new Uint8Array(m.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!m[y*w+x]) continue;
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      const X = x + i, Y = y + j;
      if (X >= 0 && X < w && Y >= 0 && Y < h) out[Y*w+X] = 1;
    }
  }
  return out;
}

// relleno por inundación desde los bordes: lo que no alcanza es interior
function exterior(bar, w, h) {
  const out = new Uint8Array(w * h), q = new Int32Array(w * h); let qa = 0, qb = 0;
  const push = i => { if (!out[i] && !bar[i]) { out[i] = 1; q[qb++] = i; } };
  for (let x = 0; x < w; x++) { push(x); push((h-1)*w + x); }
  for (let y = 0; y < h; y++) { push(y*w); push(y*w + w-1); }
  while (qa < qb) {
    const i = q[qa++], x = i % w, y = (i / w) | 0;
    if (x > 0) push(i-1);
    if (x < w-1) push(i+1);
    if (y > 0) push(i-w);
    if (y < h-1) push(i+w);
  }
  return out;
}

function bayer(n) {
  let m = [[0, 2], [3, 1]];
  while (m.length < n) {
    const k = m.length, nm = [];
    for (let y = 0; y < 2*k; y++) { nm.push([]); for (let x = 0; x < 2*k; x++) {
      nm[y].push(4 * m[y % k][x % k] + [[0, 2], [3, 1]][Math.floor(y / k)][Math.floor(x / k)]);
    } }
    m = nm;
  }
  return m.map(r => r.map(v => (v + 0.5) / (n * n)));
}

function difusion(g, mask, cols, rows, kernel, div) {
  const a = Float32Array.from(g), ink = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x; if (!mask[i]) continue;
    const o = a[i], nv = o >= 0.5 ? 1 : 0; ink[i] = nv ? 0 : 1;
    const e = (o - nv) / div;
    for (const [dx, dy, wgt] of kernel) {
      const X = x + dx, Y = y + dy;
      if (X >= 0 && X < cols && Y < rows && mask[Y*cols+X]) a[Y*cols+X] += e * wgt;
    }
  }
  return ink;
}
const ATK = [[1,0,1],[2,0,1],[-1,1,1],[0,1,1],[1,1,1],[0,2,1]];
const FS  = [[1,0,7],[-1,1,3],[0,1,5],[1,1,1]];

// máscaras a resolución fuente; se recalculan solo si cambia umbral/cierre
let cache = {};
function mascaras(umbral, cierre) {
  const key = umbral + '|' + cierre;
  if (cache.key === key) return cache;
  const { w, h, lum } = base, n = w * h;
  const line = new Uint8Array(n);
  for (let i = 0; i < n; i++) line[i] = lum[i] < umbral ? 1 : 0;
  const ext = exterior(dilatar(line, w, h, cierre), w, h);
  const inter = new Uint8Array(n);
  for (let i = 0; i < n; i++) { const x = i % w; inter[i] = !ext[i] && x >= ZONA.x0 && x < ZONA.x1 ? 1 : 0; }
  cache = { key, line, ext, inter };
  return cache;
}

// lienzo transparente del tamaño de la hoja
function capa() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

// generador pseudoaleatorio con semilla (mulberry32)
function azar(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function textoTextura(tx, tmodo) {
  const tam = +$('ttam').value, lh = tam * $('tint').value / 100;
  const frase = $('txt').value.trim();
  tx.font = `${tam}px '${$('tfuente').value}'`;
  tx.textBaseline = 'top';
  tx.fillStyle = '#000';
  const rnd = azar(+$('tsem').value * 9973);
  if (tmodo === 'filas') {
    // filas continuas, cada una desplazada para que la frase no quede en columna
    const bloque = frase + ' ', ancho = tx.measureText(bloque).width;
    let fila = 0;
    for (let y = 0; y < H; y += lh, fila++) {
      const off = -((fila * ancho * 0.37) % ancho);
      for (let x = off; x < W; x += ancho) tx.fillText(bloque, x, y);
    }
  } else {
    // palabras sueltas en una grilla, sin encimarse; algunas se desarman en letras
    const palabras = frase.split(/[\s/·,]+/).filter(Boolean);
    const n = +$('tcant').value, paso = lh, aire = tam * 0.4;
    // zonas ocupadas: parten con los números de pieza
    const tnum = +$('tnum').value, sx = W / base.w, sy = H / base.h;
    const ocupado = NUMEROS.map(([s, x, y]) => ({ x: x * sx, y: y * sy - tnum / 2, w: s.length * tnum * 0.7, h: tnum }));
    const choca = r => ocupado.some(o => r.x < o.x + o.w + aire && r.x + r.w + aire > o.x && r.y < o.y + o.h + aire && r.y + r.h + aire > o.y);
    for (let i = 0; i < n; i++) {
      const p = palabras[Math.floor(rnd() * palabras.length)];
      const cascada = rnd() < 0.25;
      for (let intento = 0; intento < 60; intento++) {
        const x = Math.floor(rnd() * (W / paso)) * paso, y = Math.floor(rnd() * (H / paso)) * paso;
        // posiciones de cada letra (o de la palabra entera)
        const piezas = [];
        if (cascada) {
          let cx = x, cy = y;
          for (const ch of p) { const w = tx.measureText(ch).width; piezas.push({ s: ch, x: cx, y: cy, w, h: tam }); cx += w * (1 + rnd() * 2); cy += rnd() < 0.5 ? lh : 0; }
        } else piezas.push({ s: p, x, y, w: tx.measureText(p).width, h: tam });
        if (piezas.some(r => r.x + r.w > W || r.y + r.h > H || choca(r))) continue;
        for (const r of piezas) { tx.fillText(r.s, r.x, r.y); ocupado.push(r); }
        break;
      }
    }
  }
}

function draw() {
  if (!base) return;
  const cell = +$('celda').value, dens = $('dens').value / 100, con = $('con').value / 100;
  const umbral = $('umbral').value / 100, cierre = +$('cierre').value;
  const modo = $('modo').value, luz = $('luz').value, lineas = $('lineas').value, inv = $('inv').checked;
  const azul = $('color').value, papel = $('papel').value;
  ['celda','dens','con','umbral','cierre'].forEach(k => $(k+'V').textContent = $(k).value);

  const { w, h } = base, M = mascaras(umbral, cierre);
  const cols = Math.floor(W / cell), rows = Math.floor(H / cell);

  // por celda: interior (mayoría), hay línea, línea que toca el exterior (silueta)
  const I = new Uint8Array(cols * rows), L = new Uint8Array(cols * rows), B = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++) {
    const y0 = Math.floor(y * h / rows), y1 = Math.max(y0 + 1, Math.floor((y + 1) * h / rows));
    for (let x = 0; x < cols; x++) {
      const x0 = Math.floor(x * w / cols), x1 = Math.max(x0 + 1, Math.floor((x + 1) * w / cols));
      let s = 0, c = 0, l = 0, e = 0;
      for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) {
        const k = j*w+i; s += M.inter[k]; c++; l |= M.line[k]; e |= M.ext[k];
      }
      const k = y*cols+x; I[k] = s / c > 0.5 ? 1 : 0; L[k] = l; B[k] = l && e ? 1 : 0;
    }
  }

  // tono por tramo horizontal del interior (sombreado tipo cilindro)
  const g = new Float32Array(cols * rows).fill(1);
  for (let y = 0; y < rows; y++) {
    let x = 0;
    while (x < cols) {
      if (!I[y*cols+x]) { x++; continue; }
      const a = x; while (x < cols && I[y*cols+x]) x++;
      const n = x - a;
      for (let i = a; i < x; i++) {
        const t = (i - a + 0.5) / n;
        const d = luz === 'der' ? 0.5 - t : luz === 'izq' ? t - 0.5 : luz === 'centro' ? Math.abs(2*t - 1) - 0.5 : 0;
        g[y*cols+i] = 1 - Math.min(1, Math.max(0, dens + con * d));
      }
    }
  }

  let ink;
  if (modo === 'atk') ink = difusion(g, I, cols, rows, ATK, 8);
  else if (modo === 'fs') ink = difusion(g, I, cols, rows, FS, 16);
  else {
    const n = modo === 'b4' ? 4 : 8, T = bayer(n);
    ink = new Uint8Array(cols * rows);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const k = y*cols+x; ink[k] = I[k] && g[k] < T[y % n][x % n] ? 1 : 0;
    }
  }
  // líneas: fuera del objeto (título, números, guías) siempre se dibujan
  for (let k = 0; k < ink.length; k++) {
    if (!L[k]) continue;
    const x = k % cols;
    const dentro = I[k] || (x > 0 && I[k-1]) || (x < cols-1 && I[k+1]) || I[k-cols] || I[k+cols];
    if (lineas === 'todas' || !dentro || (lineas === 'borde' && B[k])) ink[k] = 1;
  }

  const x0 = Math.floor((W - cols * cell) / 2), y0 = Math.floor((H - rows * cell) / 2);
  const tinta = inv ? papel : azul, fondo = inv ? azul : papel;

  // capas auxiliares: celdas con tinta y celdas interiores de la lámpara
  const capaTinta = capa(), capaInt = capa();
  const ct = capaTinta.getContext('2d'), ci = capaInt.getContext('2d');
  ct.fillStyle = ci.fillStyle = '#000';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const k = y*cols+x, px = x0 + x * cell, py = y0 + y * cell;
    if (ink[k]) ct.fillRect(px, py, cell, cell);
    if (I[k] || ink[k] && L[k] && ((x > 0 && I[k-1]) || (x < cols-1 && I[k+1]) || I[k-cols] || I[k+cols])) ci.fillRect(px, py, cell, cell);
  }

  ctx.fillStyle = fondo; ctx.fillRect(0, 0, W, H);
  const tintaColor = capa(), tc = tintaColor.getContext('2d');
  tc.drawImage(capaTinta, 0, 0); tc.globalCompositeOperation = 'source-in';
  tc.fillStyle = tinta; tc.fillRect(0, 0, W, H);
  ctx.drawImage(tintaColor, 0, 0);

  // texto como textura: color tinta sobre papel, calado (color papel) sobre la tinta
  const tmodo = $('tmodo').value;
  ['ttam','tint','topa','tcant','tsem'].forEach(k => $(k+'V').textContent = $(k).value);
  if (tmodo !== 'no' && $('txt').value.trim()) {
    const T = capa(), tx = T.getContext('2d');
    textoTextura(tx, tmodo);
    const zona = $('tzona').value;
    if (zona !== 'toda') {
      tx.globalCompositeOperation = zona === 'dentro' ? 'destination-in' : 'destination-out';
      tx.drawImage(capaInt, 0, 0);
    }
    const opa = $('topa').value / 100;
    const sobrePapel = capa(), sp = sobrePapel.getContext('2d');
    sp.drawImage(T, 0, 0); sp.globalCompositeOperation = 'source-in';
    sp.fillStyle = tinta; sp.fillRect(0, 0, W, H);
    sp.globalCompositeOperation = 'destination-out'; sp.drawImage(capaTinta, 0, 0);
    const sobreTinta = capa(), st = sobreTinta.getContext('2d');
    st.drawImage(T, 0, 0); st.globalCompositeOperation = 'source-in';
    st.fillStyle = fondo; st.fillRect(0, 0, W, H);
    st.globalCompositeOperation = 'destination-in'; st.drawImage(capaTinta, 0, 0);
    ctx.globalAlpha = opa;
    ctx.drawImage(sobrePapel, 0, 0); ctx.drawImage(sobreTinta, 0, 0);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = tinta;

  const fuente = $('fuente').value, tnum = +$('tnum').value;
  $('tnumV').textContent = tnum;
  if (fuente) {
    const sx = W / base.w, sy = H / base.h;
    ctx.font = `${tnum}px '${fuente}'`;
    ctx.textBaseline = 'middle';
    for (const [txt, x, y] of NUMEROS) ctx.fillText(txt, x * sx, y * sy);
  }
}

let raf;
document.querySelectorAll('.panel input, .panel select').forEach(el =>
  el.addEventListener('input', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }));

$('png').onclick = () => {
  const a = document.createElement('a');
  a.download = `uzu001-planimetria-relleno-${$('modo').value}-${$('celda').value}px.png`;
  a.href = cv.toDataURL('image/png'); a.click();
};
$('ver').onclick = () => {
  const z = $('zoom'); z.innerHTML = '';
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
  c2.getContext('2d').drawImage(cv, 0, 0); z.appendChild(c2);
  z.style.display = 'block'; z.scrollTop = (H - innerHeight) / 2; z.scrollLeft = (W - innerWidth) / 2;
};
$('zoom').onclick = () => $('zoom').style.display = 'none';
